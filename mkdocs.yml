site_name: Voluta
site_description: Matemática e geometria de sopradores centrífugos com Python.
site_url: https://dionarley.github.io/voluta/
site_author: Dionarley
repo_url: https://github.com/dionarley/voluta
repo_name: dionarley/voluta
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Dionarley — licença MIT

theme:
  name: material
  language: pt-BR
  logo: assets/voluta-icon.svg
  favicon: assets/voluta-icon.svg
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para tema escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para tema claro
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow

nav:
  - Início: index.md
  - Matemática: matematica.md
  - Uso: uso.md
  - Flatpak: flatpak.md
  - API: api.md
  - Referências: referencias.md
  - Código-fonte: https://github.com/dionarley/voluta

hooks:
  - hooks/copy_assets.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
