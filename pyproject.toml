[project]
name = "voluta"
version = "0.2.0"
description = "Geometria e dimensionamento de sopradores centrífugos: voluta, rotor e leis de afinidade."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Dionarley", email = "dionarley@gmail.com" },
]
keywords = [
  "blower",
  "centrifugal",
  "impeller",
  "turbomachinery",
  "volute",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.optional-dependencies]
gui = [
  "PySide6-Essentials>=6.7",
]

[project.scripts]
voluta = "voluta.cli:main"

[dependency-groups]
dev = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
  "pyinstaller>=6.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]
gui = [
  "PySide6-Essentials>=6.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voluta"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:matplotlib.*",
]

[tool.coverage.run]
branch = true
source = ["voluta"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
extend-exclude = ["examples/legacy_shape_soprador.py"]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["voluta"]
